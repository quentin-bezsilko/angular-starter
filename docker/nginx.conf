server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA
    # Les routes inconnues côté Nginx sont renvoyées vers Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets statiques générés par Angular
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit pas être mis en cache agressivement,
    # afin que les nouveaux déploiements soient récupérés rapidement.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Endpoint pratique pour les probes Docker / Kubernetes.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }
}
