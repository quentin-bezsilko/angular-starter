services:
  angular-starter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: angular-starter:latest
    container_name: angular-starter
    ports:
      - "4200:80"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s