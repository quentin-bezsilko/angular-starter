<div
  class="import-result"
  [class.import-result--success]="result.failed === 0"
  [class.import-result--warning]="result.failed > 0"
>
  <div class="import-result__header">
    <div class="import-result__title">
      <span class="import-result__icon">
        {{ result.failed === 0 ? "✅" : "⚠️" }}
      </span>

      <strong> {{ result.created }} sample(s) créé(s) </strong>
    </div>

    <button
      type="button"
      class="import-result__close"
      (click)="closed.emit()"
      aria-label="Fermer"
    >
      ✕
    </button>
  </div>

  @if (result.failed > 0) {
  <p>{{ result.failed }} erreur(s) détectée(s)</p>

  <ul>
    @for (error of result.errors; track $index) {
    <li>Ligne {{ error.row }} : {{ error.message }}</li>
    }
  </ul>
  }
</div>
