<section class="sample-list">
  <header class="sample-list__header">
    <app-sample-toolbar
      [canRead]="canRead()"
      [canWrite]="canWrite()"
      (export)="exportExcel()"
      (import)="onImportFile($event)"
    ></app-sample-toolbar>
  </header>

  @if (hasSelection()) {
  <app-sample-bulk-actions
    [selectedCount]="selectedCount()"
    (export)="bulkExport()"
    (duplicate)="bulkDuplicate()"
    (activate)="bulkUpdateStatus(SampleStatus.ACTIVE)"
    (moveToTrash)="bulkMoveToTrash()"
  />
  } @if (showImportResult && importResult; as result) {
  <app-sample-import-result
    [result]="result"
    (close)="showImportResult = false"
  />
  }

  <app-sample-filters
    [search]="search()"
    [status]="statusFilter()"
    [category]="categoryFilter()"
    [active]="activeFilter()"
    [favoritesOnly]="favoritesOnly()"
    [statuses]="statuses"
    (searchChange)="onSearchChange($event)"
    (statusChange)="statusFilter.set($event); applyFilters()"
    (categoryChange)="categoryFilter.set($event)"
    (activeChange)="activeFilter.set($event); applyFilters()"
    (toggleFavorites)="favoritesOnly.update((v) => !v)"
    (apply)="applyFilters()"
    (reset)="resetFilters()"
  />

  @if (loading()) {
  <div class="state">
    <p>Chargement des samples...</p>
  </div>
  } @else if (error()) {
  <div class="state state--error">
    <p>{{ error() }}</p>

    <button type="button" class="button" (click)="loadSamples()">
      Réessayer
    </button>
  </div>
  } @else if (samples().length === 0) {
  <div class="state">
    <h2>Aucun sample</h2>

    <p>Aucun sample n'est disponible pour le moment.</p>

    <a class="button button--primary" routerLink="/samples/new">
      Créer le premier sample
    </a>
  </div>
  } @else {
  <app-sample-table
    [samples]="displayedSamples()"
    [selectedIds]="selectedIds()"
    [canRead]="canRead()"
    [canWrite]="canWrite()"
    [loading]="loading()"
    [sortColumn]="sortColumn()"
    [sortDirection]="sortDirection()"
    (sort)="sortBy($event)"
    (toggleFavorite)="toggleFavorite($event)"
    (duplicate)="duplicate($event)"
    (moveToTrash)="moveToTrash($event)"
    (toggleSelection)="toggleSelection($event.id, $event.checked)"
    (toggleAll)="toggleAll($event)"
  />

  <app-sample-pagination
    [totalElements]="totalElements()"
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (previous)="previousPage()"
    (next)="nextPage()"
  />
  }
</section>
